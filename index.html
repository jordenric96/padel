<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padel Competitie - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase Inladen -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🎾 PADEL LEAGUE</div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Dashboard</a></li>
            <!-- Kalender html mag je later aanpassen, voor nu werkt het dashboard! -->
        </ul>
    </nav>

    <div class="container dashboard">
        <header class="dash-header">
            <h1>SEIZOEN OVERZICHT</h1>
            <p class="subtitle" id="status-text">Status laden...</p>
        </header>

        <!-- Matchday Widgets (Worden ingevuld door JS) -->
        <div class="matchday-container">
            <div class="card matchday-card past-match" id="past-match-widget">
                <!-- Data komt hier -->
            </div>
            <div class="card matchday-card next-match" id="next-match-widget">
                <!-- Data komt hier -->
            </div>
        </div>

        <h2 class="section-title">📊 HALL OF FAME</h2>
        <div class="stats-grid" id="stats-grid-container">
            <!-- Stats komen hier live -->
        </div>

        <div class="leaderboards-container">
            <div class="card leaderboard-card">
                <h2>🏆 INDIVIDUEEL KLASSEMENT</h2>
                <div class="table-responsive">
                    <table class="leaderboard-table">
                        <thead>
                            <tr><th>#</th><th>Speler</th><th>G</th><th>W</th><th>V</th><th>Saldo</th></tr>
                        </thead>
                        <tbody id="individual-leaderboard"></tbody>
                    </table>
                </div>
            </div>

            <div class="card leaderboard-card duo-card">
                <h2>🤝 DUO KLASSEMENT (TOP 5)</h2>
                <div class="table-responsive">
                    <table class="leaderboard-table">
                        <thead>
                            <tr><th>#</th><th>Duo</th><th>W - V</th><th>Win %</th></tr>
                        </thead>
                        <tbody id="duo-leaderboard"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modaal venster voor het ingeven van scores & tussenstanden -->
    <div class="modal-overlay" id="score-modal">
        <div class="modal-content">
            <h3 class="modal-title">Vul Score In</h3>
            <p style="color:var(--text-muted); font-size:12px; margin-top:-15px; margin-bottom: 20px;">Match <span id="modal-match-id"></span></p>
            
            <div class="score-inputs">
                <div class="score-group">
                    <label id="modal-t1-names">Team 1</label>
                    <input type="number" id="input-t1" placeholder="0">
                </div>
                <div style="font-family:'Oswald'; color:var(--royal-gold);">VS</div>
                <div class="score-group">
                    <label id="modal-t2-names">Team 2</label>
                    <input type="number" id="input-t2" placeholder="0">
                </div>
            </div>
            
            <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
                <input type="checkbox" id="is-tussenstand" style="width:18px; height:18px;">
                <label for="is-tussenstand" style="color:white; font-size:14px; font-weight:600;">Dit is een TUSSENSTAND (Match loopt nog)</label>
            </div>

            <div class="modal-actions">
                <button class="btn-close" onclick="closeModal()">Annuleren</button>
                <button class="btn-save" onclick="saveScore()">Opslaan</button>
            </div>
        </div>
    </div>

    <!-- Koppel je nieuwe JS script -->
    <script src="app.js"></script>
</body>
</html>
